<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controller HP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            overflow: hidden;
        }
        h2 { color: #facc15; font-size: 1.6rem; text-align: center; }
        p { color: #94a3b8; font-size: 0.95rem; text-align: center; margin-top: 6px; }

        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        input {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }
        button.btn-join {
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: #22c55e;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .dpad-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 340px;
            margin-bottom: 20px;
        }
        .btn-ctrl {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: #2563eb;
            color: #fff;
            font-size: 2.8rem;
            box-shadow: 0 8px 0 #1d4ed8;
            transition: all 0.05s ease;
        }
        .btn-ctrl:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #1d4ed8;
            background: #1d4ed8;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div>
        <h2>Gamepad Videotron</h2>
        <p id="status-text">Hubungkan ke layar untuk mulai bermain</p>
    </div>

    <!-- Tampilan 1: Input Nama -->
    <div id="join-card" class="card">
        <input type="text" id="player-name" placeholder="Ketik Namamu..." maxlength="15" autocomplete="off" />
        <button class="btn-join" onclick="joinGame()">Mulai Bermain</button>
    </div>

    <!-- Tampilan 2: Tombol Gamepad HP -->
    <div id="dpad-card" class="dpad-container hidden">
        <button class="btn-ctrl" id="btn-left">◀</button>
        <button class="btn-ctrl" id="btn-right">▶</button>
    </div>

    <p style="font-size: 0.8rem; color: #475569;">Interactive Videotron Controller</p>

    <script>
        // Masukkan URL Ngrok Backend Docker kamu
        const BACKEND_URL = "https://delighted-steam-impurity.ngrok-free.dev";

        const connection = new signalR.HubConnectionBuilder()
            .withUrl(BACKEND_URL + "/hubs/game")
            .withAutomaticReconnect()
            .build();

        connection.start()
            .then(() => { document.getElementById("status-text").textContent = "Terhubung! Masukkan nama:"; })
            .catch(err => { document.getElementById("status-text").textContent = "Gagal terhubung ke server."; });

        function joinGame() {
            const name = document.getElementById("player-name").value.trim();
            if (!name) return alert("Silakan isi nama terlebih dahulu!");

            connection.invoke("RegisterQueue", name)
                .then(() => {
                    document.getElementById("join-card").classList.add("hidden");
                    document.getElementById("dpad-card").classList.remove("hidden");
                    document.getElementById("status-text").textContent = "Kendalikan keranjang dari tombol ini:";
                })
                .catch(err => alert("Gagal mendaftar: " + err));
        }

        function bindDpad(buttonId, keyCode) {
            const btn = document.getElementById(buttonId);
            const send = (isPressed) => {
                if (connection.state === signalR.HubConnectionState.Connected) {
                    connection.invoke("SendMove", keyCode, isPressed);
                }
            };
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); send(true); }, { passive: false });
            btn.addEventListener("touchend", (e) => { e.preventDefault(); send(false); });
            btn.addEventListener("mousedown", () => send(true));
            btn.addEventListener("mouseup", () => send(false));
        }

        bindDpad("btn-left", "ArrowLeft");
        bindDpad("btn-right", "ArrowRight");
    </script>
</body>
</html>
