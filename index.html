<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Falling Objects - Videotron</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Pustaka QRCode & SignalR CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <style>
        /* Popup overlay transisi giliran & game over */
        #announcement-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99;
            color: #ffffff;
            text-align: center;
        }
        #announcement-title {
            font-size: 3rem;
            color: #facc15;
            margin-bottom: 12px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #announcement-sub {
            font-size: 1.6rem;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Overlay Pengumuman Popup Transisi -->
        <div id="announcement-overlay" class="hidden">
            <h1 id="announcement-title">Giliran Pemain!</h1>
            <p id="announcement-sub">Bersiap dalam 3...</p>
        </div>

        <!-- Layar Lobby Antrean & QR Code -->
        <div id="start-screen" class="screen">
            <h1>Catch the Objects!</h1>
            <p>Pindai QR Code lewat kamera HP untuk mulai bermain:</p>
            
            <div id="qrcode-wrapper" style="display: flex; justify-content: center; margin: 15px 0;">
                <div id="qrcode" style="padding: 10px; background: #fff; border-radius: 10px;"></div>
            </div>

            <p id="lobby-status" style="font-weight: bold; color: #2e7d32;">Menunggu pemain bergabung...</p>
        </div>
        
        <!-- Layar Game Play -->
        <div id="game-screen" class="screen hidden">
            <canvas id="gameCanvas"></canvas>
            <button id="pause-button">Pause</button>
        </div>
        
        <!-- Layar Game Over -->
        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over!</h1>
            <p id="game-over-message">Game Over!</p>
            <p>Final Score: <span id="final-score">0</span></p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
